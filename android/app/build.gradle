apply plugin: 'com.android.application'

def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def releaseStorePath = (
    System.getenv('ANDROID_KEYSTORE_PATH')
    ?: project.findProperty('RELEASE_STORE_FILE')
    ?: keystoreProps.getProperty('storeFile')
)?.toString()?.trim()

def releaseStorePassword = (
    System.getenv('ANDROID_KEYSTORE_PASSWORD')
    ?: project.findProperty('RELEASE_STORE_PASSWORD')
    ?: keystoreProps.getProperty('storePassword')
)?.toString()

def releaseKeyAlias = (
    System.getenv('ANDROID_KEY_ALIAS')
    ?: project.findProperty('RELEASE_KEY_ALIAS')
    ?: keystoreProps.getProperty('keyAlias')
)?.toString()?.trim()

def releaseKeyPassword = (
    System.getenv('ANDROID_KEY_PASSWORD')
    ?: project.findProperty('RELEASE_KEY_PASSWORD')
    ?: keystoreProps.getProperty('keyPassword')
)?.toString()

def releaseStoreFile = releaseStorePath
    ? (new File(releaseStorePath).isAbsolute() ? new File(releaseStorePath) : rootProject.file(releaseStorePath))
    : null

def hasReleaseSigning = Boolean.valueOf(
    releaseStoreFile != null &&
    releaseStoreFile.exists() &&
    releaseStorePassword != null && !releaseStorePassword.isEmpty() &&
    releaseKeyAlias != null && !releaseKeyAlias.isEmpty() &&
    releaseKeyPassword != null && !releaseKeyPassword.isEmpty()
)

def resolvedVersionCode = (
    project.findProperty('versionCode')
    ?: System.getenv('ANDROID_VERSION_CODE')
    ?: project.findProperty('VERSION_CODE')
    ?: '1'
).toString().trim().toInteger()

def resolvedVersionName = (
    project.findProperty('versionName')
    ?: System.getenv('ANDROID_VERSION_NAME')
    ?: project.findProperty('VERSION_NAME')
    ?: '1.0.0'
).toString().trim()

android {
    namespace = "com.kingdomchess.game"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.kingdomchess.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def requiresReleaseSigning = taskGraph.allTasks.any { task ->
        task.path.startsWith(':app:') && (
            task.name == 'bundleRelease' ||
            task.name == 'assembleRelease' ||
            task.name.contains('ReleaseBundle') ||
            task.name.contains('SignRelease')
        )
    }
    if (requiresReleaseSigning && !hasReleaseSigning) {
        throw new GradleException(
            "Missing Play Store release signing configuration. Supply ANDROID_KEYSTORE_PATH, " +
            "ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD " +
            "(or create android/keystore.properties)."
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
