name: Build Kingdom Chess APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract project
        run: |
          unzip -o kingdom-chess.zip -d project
          echo "Extracted files:"
          find project -maxdepth 2 -type f | head -50

      - name: Find Android project
        run: |
          ANDROID_DIR=$(find project -type f -name gradlew -print -quit | xargs dirname)
          echo "ANDROID_DIR=$ANDROID_DIR" >> $GITHUB_ENV

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kingdom-Chess-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk
